<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Admin</title>
    <link rel="icon" href="./imgs/Logo_QĐNDVN.png" type="image/x-icon" />
    <link rel="stylesheet" href="./main/css/login.css" />
  </head>
  <body>
    <div id="background"></div>
    <form onsubmit="event.preventDefault(); login();">
      <h2>Đăng nhập Admin</h2>
      <input type="text" id="username" placeholder="Tên đăng nhập" required />
      <input type="password" id="password" placeholder="Mật khẩu" required />
      <button type="submit">Đăng nhập</button>
    </form>
    <script src="./global.js"></script>
    <script src="./api.js"></script>
    <script src="./main/js/login.js"></script>
  </body>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h3>Thông báo</h3>
      <p id="popupMessage">Nội dung popup...</p>
      <button onclick="closePopup()" class="popup-btn popup-btn-close">
        Thoát
      </button>
    </div>
  </div>
</html>
