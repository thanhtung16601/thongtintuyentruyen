<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Admin</title>
    <link rel="icon" href="../imgs/Logo_QĐNDVN.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="background"></div>
    <div class="btn-group">
      <a class="logout" href="../">Đăng xuất</a>
    </div>
    <div class="container">
      <div id="manager-table">
        <h2>Quản lý Đơn Đăng Ký</h2>
        <div class="toolbar">
          <button id="reloadBtn" class="btn-reload">🔄 Danh sách mới</button>

          <div class="search-group">
            <input
              type="text"
              id="searchInput"
              placeholder="Tìm theo tên, CCCD, SĐT, đơn vị, trạng thái..."
            />
            <button id="searchBtn">🔍</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="adminTable">
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>CCCD</th>
                <th>SĐT</th>
                <th>Tỉnh/Thành - Xã/Phường</th>
                <th>Quan hệ</th>
                <th>Quân nhân</th>
                <th>Thông tin</th>
                <th>Hành động</th>
              </tr>
            </thead>

            <tbody id="adminBody">
              <tr>
                <td colspan="8">Đang tải...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="manager-details" class="manager-details">
        <div class="manager-details-item">
          <b>Chưa duyệt: </b> <span id="tk-wait">0</span>
        </div>
        <div class="manager-details-item">
          <b>Đã duyệt: </b> <span id="tk-confirm">0</span>
        </div>
        <div class="manager-details-item">
          <b>Đã loại: </b> <span id="tk-refuse">0</span>
        </div>
        <div class="manager-details-item">
          <b>Tổng lượt khách: </b> <span id="tk-total">0</span>
        </div>
      </div>

      <div id="manager-postmanInfo">
        <h2>Quản lý bài viết</h2>
        <div id="postmans"></div>
      </div>
    </div>
  </body>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h3>Thông báo</h3>
      <p id="popupMessage">Nội dung popup...</p>

      <button onclick="confirmPopup()" class="popup-btn popup-btn-confirm">
        Xác nhận
      </button>
      <button onclick="closePopup()" class="popup-btn popup-btn-close">
        Thoát
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../global.js"></script>
  <script src="../api.js"></script>
  <script src="./postman.js"></script>
  <script src="./script.js"></script>
</html>
