<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Admin</title>
    <link rel="icon" href="../imgs/Logo_QĐNDVN.png" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <script>
    const token = localStorage.getItem("token");
    const exp = localStorage.getItem("token_exp");

    if (!token || !exp || Date.now() > Number(exp)) {
      window.location.href = "/thongtintuyentruyen/login.html";
    }
  </script>

  <body>
    <div id="background"></div>
    <div class="btn-group">
      <button class="logout" onclick="logout()">Đăng xuất</button>
    </div>
    <div class="container">
      <div id="manager-table">
        <h2>Quản lý Đơn Đăng Ký</h2>
        <div class="toolbar">
          <button id="reloadBtn" class="btn-reload">🔄 Danh sách mới</button>

          <div class="search-group">
            <input
              type="date"
              id="startTime"
              class="manager-details-item"
              placeholder="Thời gian bắt đầu"
            />

            <input
              type="date"
              id="endTime"
              class="manager-details-item"
              placeholder="Thời gian kết thúc"
            />
            <input
              type="text"
              id="searchInput"
              class="manager-details-item"
              placeholder="Tìm theo tên, CCCD, SĐT, đơn vị, trạng thái..."
            />
            <button id="searchBtn">🔍</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="adminTable">
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>CCCD</th>
                <th>SĐT</th>
                <th>Tỉnh/Thành - Xã/Phường</th>
                <th>Quan hệ</th>
                <th>Quân nhân</th>
                <th>Thông tin</th>
                <th>Hành động</th>
              </tr>
            </thead>

            <tbody id="adminBody">
              <tr>
                <td colspan="8">Đang tải...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="manager-details" class="manager-details">
        <div class="manager-details-item">
          <b>Chưa duyệt: </b> <span id="tk-wait">0</span>
        </div>
        <div class="manager-details-item">
          <b>Đã duyệt: </b> <span id="tk-confirm">0</span>
        </div>
        <div class="manager-details-item">
          <b>Đã loại: </b> <span id="tk-refuse">0</span>
        </div>
        <div class="manager-details-item">
          <b>Tổng lượt khách: </b> <span id="tk-total">0</span>
        </div>
      </div>

      <div id="manager-postmanInfo" class="container-manager-posts">
        <h2>Quản lý bài viết</h2>
        <div class="container-posts">
          <div class="formPost">
            <button type="button" class="btn-post" onclick="btnPostShow()">
              Viết bài
            </button>
          </div>
          <div id="postmans" class="posts"></div>
        </div>
      </div>
    </div>
  </body>

  <!-- Popup -->
  <div id="popup-comment" class="popup popup-comment">
    <div class="popup-content">
      <h2 id="header-popup" class="header-popup">
        <strong>TẠO BÀI VIẾT</strong>
      </h2>
      <div id="popupMessage" class="toggleShowMesage">
        <div>
          <input
            placeholder="Tiêu đề bài viết"
            id="content_txtHeader"
            type="text"
          />
          <select name="content_position" id="content_position">
            <option value="Bình thường">Bình thường</option>
            <option value="Khá quan trọng">Khá quan trọng</option>
            <option value="Quan trọng">Quan trọng</option>
          </select>
        </div>
        <textarea
          placeholder="Nội dung bài viết.."
          name="txtPost"
          id="content_txtPost"
          class="txtPost"
          rows="5"
        ></textarea>
        <div class="btn-group">
          <button
            id="btnSelectImage"
            class="btnSelectImage"
            onclick="btnPushImage()"
          >
            📷 Thêm ảnh
          </button>
          <button
            id="btnDeleteImage"
            class="btnDeleteImage"
            onclick="btnDeleteImage()"
          >
            xoá ảnh
          </button>
        </div>
        <input
          type="file"
          id="content_imgPost"
          accept="image/*"
          multiple
          hidden
        />
      </div>

      <div class="popup-footer-comment">
        <div id="previewImages" class="preview-image"></div>

        <button
          id="popup-btn-confirm"
          onclick="uploadPoster()"
          class="popup-btn popup-btn-confirm"
        >
          Đăng bài
        </button>
        <button
          id="popup-btn-close"
          onclick="clearPoster()"
          class="popup-btn popup-btn-close"
        >
          Thoát
        </button>
      </div>
    </div>
  </div>
  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h3 id="header-popup" class="header-popup">Thông báo</h3>
      <p id="showMesage" class="showMesage"></p>

      <button
        id="popup-btn-confirm"
        onclick="confirmPopup()"
        class="popup-btn popup-btn-confirm"
      >
        Xác nhận
      </button>
      <button
        id="popup-btn-close"
        onclick="closePopup()"
        class="popup-btn popup-btn-close"
      >
        Thoát
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../author.js"></script>
  <script src="../global.js"></script>
  <script src="../api.js"></script>
  <script src="./postman.js"></script>
  <script src="./script.js"></script>
</html>
